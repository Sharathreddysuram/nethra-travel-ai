apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: nethra, labels: { app: frontend, platform: nethra-travel-ai } }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: nethra/frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 80 }]
        readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: nethra, labels: { app: frontend } }
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: nethra
  labels: { app: user-service, platform: nethra-travel-ai }
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
      - name: user-service
        image: nethra/user-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8081 }]

        readinessProbe: { httpGet: { path: /actuator/health, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: nethra
  labels: { app: user-service }
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: destination-service
  namespace: nethra
  labels: { app: destination-service, platform: nethra-travel-ai }
spec:
  replicas: 1
  selector: { matchLabels: { app: destination-service } }
  template:
    metadata: { labels: { app: destination-service } }
    spec:
      containers:
      - name: destination-service
        image: nethra/destination-service:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8083 }]

        readinessProbe: { httpGet: { path: /actuator/health, port: 8083 }, initialDelaySeconds: 20, periodSeconds: 10 }
        resources: { requests: { cpu: "100m", memory: "256Mi" }, limits: { cpu: "500m", memory: "512Mi" } }
---
apiVersion: v1
kind: Service
metadata:
  name: destination-service
  namespace: nethra
  labels: { app: destination-service }
spec:
  type: ClusterIP
  selector: { app: destination-service }
  ports: [{ port: 8083, targetPort: 8083 }]

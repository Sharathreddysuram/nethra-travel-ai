{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: { app: {{ .name }}, platform: nethra-travel-ai }
spec:
  replicas: {{ .replicas }}
  selector: { matchLabels: { app: {{ .name }} } }
  template:
    metadata: { labels: { app: {{ .name }} } }
    spec:
      containers:
      - name: {{ .name }}
        image: nethra/{{ .name }}:{{ $.Values.imageTag }}
        ports: [{ containerPort: {{ .port }} }]
        readinessProbe: { httpGet: { path: /actuator/health, port: {{ .port }} }, initialDelaySeconds: 20, periodSeconds: 10 }
---
{{- end }}

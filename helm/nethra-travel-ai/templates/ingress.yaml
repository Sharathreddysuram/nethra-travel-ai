apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: nethra-ingress }
spec:
  ingressClassName: nginx
  rules:
  - host: nethra.local
    http:
      paths:
      - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
      - { path: /api, pathType: Prefix, backend: { service: { name: api-gateway, port: { number: 8080 } } } }
      - { path: /ai, pathType: Prefix, backend: { service: { name: api-gateway, port: { number: 8080 } } } }

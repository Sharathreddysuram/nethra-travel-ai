apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, labels: { app: frontend, platform: nethra-travel-ai } }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: nethra/frontend:{{ .Values.imageTag }}
        ports: [{ containerPort: 80 }]

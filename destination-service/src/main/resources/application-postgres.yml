spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nethra_destination_service}
    username: ${DB_USERNAME:nethra}
    password: ${DB_PASSWORD:nethra}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

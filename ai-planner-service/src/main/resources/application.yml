server:
  port: 8089
spring:
  application:
    name: ai-planner-service
  datasource:
    url: jdbc:h2:mem:aiplannerservice;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
services:
  budget: { url: "${BUDGET_SERVICE_URL:http://localhost:8082}" }
  destination: { url: "${DESTINATION_SERVICE_URL:http://localhost:8083}" }
  transport: { url: "${TRANSPORT_SERVICE_URL:http://localhost:8084}" }
  hotel: { url: "${HOTEL_SERVICE_URL:http://localhost:8085}" }
  activity: { url: "${ACTIVITY_SERVICE_URL:http://localhost:8086}" }
  partner: { url: "${PARTNER_SERVICE_URL:http://localhost:8087}" }
  itinerary: { url: "${ITINERARY_SERVICE_URL:http://localhost:8088}" }
  notification: { url: "${NOTIFICATION_SERVICE_URL:http://localhost:8090}" }
openai:
  api-key: "${OPENAI_API_KEY:}"
  model: "${OPENAI_MODEL:gpt-4o-mini}"
